function aggItems(){
  var map={},order=[];
  function add(l){
    var p=vp(l);if(p===null)return;
    if(l.gen)return;
    var key=l.n;
    var g=(l.g||"סעיפים נוספים");
    if(!map[key]){map[key]={n:key,g:g,sum:0,cnt:0};order.push(key);}
    map[key].sum+=p;map[key].cnt+=qv(l);
  }
  D.zones.forEach(function(z){z.lines.forEach(add);});
  D.gen.forEach(add);
  var hv=hobv();if(hv!==null){map["פירוקים והובלות כלליות"]={n:"פירוקים והובלות כלליות",g:"כללי",sum:hv,cnt:1};order.push("פירוקים והובלות כלליות");}
  var byg={},go=[];
  order.forEach(function(k){var o=map[k];if(!byg[o.g]){byg[o.g]=[];go.push(o.g);}byg[o.g].push(o);});
  return {byg:byg,go:go};
}
